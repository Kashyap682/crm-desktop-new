name: Build and Release

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ─────────────────────────────────────────────
  #  macOS  →  .dmg  +  .zip
  # ─────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and publish (macOS)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false   # skip code-signing on CI
        run: npm run electron:publish -- --mac

  # ─────────────────────────────────────────────
  #  Windows  →  .exe (NSIS)  +  .zip
  # ─────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and publish (Windows)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npm run electron:publish -- --win

  # ─────────────────────────────────────────────
  #  Linux  →  .AppImage  +  .deb  +  .rpm
  # ─────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install RPM packaging tools
        run: sudo apt-get install -y rpm

      - name: Install dependencies
        run: npm ci

      - name: Build and publish (Linux)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npm run electron:publish -- --linux
